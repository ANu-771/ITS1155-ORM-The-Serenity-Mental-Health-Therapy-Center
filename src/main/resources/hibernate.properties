# Hibernate Configuration for Serenity Mental Health Therapy Center
# MySQL Database Connection Settings

hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
hibernate.connection.url=jdbc:mysql://localhost:3306/serenity_therapy_center?createDatabaseIfNotExist=true
hibernate.connection.username=root
hibernate.connection.password=mysql

# Hibernate Dialect
hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Schema Auto-Update (creates/updates tables automatically)
hibernate.hbm2ddl.auto=update

# Show SQL in console (useful for debugging)
hibernate.show_sql=true
hibernate.format_sql=true

# Connection Pool Settings
hibernate.c3p0.min_size=5
hibernate.c3p0.max_size=20
hibernate.c3p0.timeout=300
